# CI for sz-kotlin-sdk. Linux ARM runners do the full job: lint, generated-code drift, the
# real-engine test suite with 100% coverage, and the example programs. A Linux x64 job builds
# the Android arm64 JNI library. macOS (expensive runners) is tested locally.
#
# The tests run against the REAL native Senzing engine (no mocks), so the test job installs a
# released Senzing runtime from Senzing's production apt repository
# (tools/ci/install-senzing-apt.sh), pinned to SENZING_VERSION.
#
# Installing Senzing requires accepting the Senzing EULA
# (https://senzing.com/end-user-license-agreement); running this workflow constitutes that
# acceptance.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SENZING_VERSION: "4.5.0"
  SENZING_DIR: /opt/senzing/er

jobs:
  lint:
    name: Lint (ktlint, rustfmt, clippy)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: rustfmt and clippy
        working-directory: native
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings

  test-linux:
    name: Linux JVM (JDK 17, Ubuntu 24.04 arm64)
    runs-on: ubuntu-24.04-arm
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Senzing runtime
        run: tools/ci/install-senzing-apt.sh
      - name: Generated code matches the installed runtime
        run: |
          ./gradlew :tools:generateFlags
          git diff --exit-code -- sdk/src/main/kotlin/io/github/brianmacy/sz/SzFlags.kt
          cmp native/szerrors.json "$SENZING_DIR/sdk/szerrors.json"
      - name: Rust unit tests
        working-directory: native
        run: cargo test
      - name: Test (real engine) and 100% coverage
        run: ./gradlew :sdk:test :sdk:koverVerify :sdk:koverLog
      - name: Examples
        run: |
          for example in AsyncEngine LoadTruthset Logging Search Why; do
            echo "::group::$example"
            ./gradlew -q ":examples:run$example"
            echo "::endgroup::"
          done
      - name: API documentation
        run: ./gradlew :sdk:dokkaGeneratePublicationHtml

  android:
    name: Android arm64 JNI library (cargo-ndk)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Senzing runtime (C headers)
        run: tools/ci/install-senzing-apt.sh
      - name: Rust Android target and cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: ./gradlew :sdk:cargoBuildAndroid
